services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/linger.db
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
    volumes:
      - linger-data:/app/apps/api/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws/voice}
        NEXT_PUBLIC_VOICE_PROVIDER: ${NEXT_PUBLIC_VOICE_PROVIDER:-mock}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws/voice}
      NEXT_PUBLIC_VOICE_PROVIDER: ${NEXT_PUBLIC_VOICE_PROVIDER:-mock}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  linger-data:
