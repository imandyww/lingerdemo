[project]
name = "linger-api"
version = "0.1.0"
description = "FastAPI realtime orchestration and family archive service for Linger"
requires-python = "==3.12.*"
dependencies = [
  "aiosqlite==0.21.0",
  "alembic==1.16.5",
  "asyncpg==0.31.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "openai==2.52.0",
  "pydantic==2.11.9",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "sqlalchemy[asyncio]==2.0.43",
  "uvicorn[standard]==0.35.0",
  "websockets==15.0.1",
]

[dependency-groups]
dev = [
  "mypy==1.18.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "ruff==0.13.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linger_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["aiosqlite.*"]
ignore_missing_imports = true
